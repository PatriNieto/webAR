<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR</title>
  
  <!-- Carga del componente <model-viewer> de ajax-->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
/*      Estilos básicos para centrar el contenido y mejorar la apariencia
 */    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f0f0; }
    model-viewer { width: 100%; height: 80vh; }
    .ar-button { background-color: #007AFF; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- Componente con soporte nativo para AR en iOS y Android -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Un astronauta en 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    shadow-intensity="1"
    scale="0.1 0.1 0.1">
    
    <button slot="ar-button" class="ar-button">
      Ver en tu espacio 📍
    </button>
    
  </model-viewer>

</body>
</html>
