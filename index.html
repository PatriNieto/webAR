<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partículas de Luz WebAR</title>
  
  <!-- Carga oficial del visor de WebAR de Google compatible con iOS Quick Look -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      background-color: #0d0d0d; 
    }
    model-viewer { 
      width: 100%; 
      height: 85vh; 
    }
    .ar-button { 
      background-color: #007AFF; 
      color: white; 
      border: none; 
      padding: 14px 28px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 30px; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); 
    }
  </style>
</head>
<body>

  <!-- Carga una escena de partículas ligeras y brillantes optimizada para Quick Look y Android -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/StainedGlassLamp/glTF-Binary/StainedGlassLamp.glb" 
    ios-src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/AlphaBlendModeTest/glTF-USDZ/AlphaBlendModeTest.usdz"
    alt="Luz y Partículas WebAR" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    autoplay 
    shadow-intensity="0">
    
    <button slot="ar-button" class="ar-button">
      Ver en tu espacio 📍
    </button>
    
  </model-viewer>

</body>
</html>
