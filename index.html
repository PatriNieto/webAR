<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partículas Animadas WebAR</title>
  
  <!-- Componente <model-viewer> oficial de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      background-color: #121212; 
      color: #ffffff;
    }
    
    model-viewer { 
      width: 100%; 
      height: 85vh; 
    }

    .ar-button { 
      background-color: #007AFF; 
      color: white; 
      border: none; 
      padding: 14px 28px; 
      font-size: 16px; 
      font-weight: 600; 
      border-radius: 30px; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4); 
      transition: background-color 0.2s ease;
    }

    .ar-button:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Carga de modelos localmente -->
  <model-viewer 
    src="./particles.glb" 
    ios-src="./particles.usdz"
    alt="Partículas 3D animadas" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    ar-scale="fixed"
    autoplay 
    camera-controls 
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      Ver en tu espacio 📍
    </button>
    
  </model-viewer>

</body>
</html>
