<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Partículas Real WebAR</title>
  
  <!-- A-Frame (Motor WebXR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  
  <!-- Componente Oficial de Sistema de Partículas para WebAR -->
  <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Escena de Realidad Aumentada -->
  <a-scene webxr="optionalFeatures: hit-test;" arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Contenedor del Sistema de Partículas Reales -->
    <a-entity position="0 1.2 -2" particle-system="
      preset: dust;
      particleCount: 1200;
      color: #FFB300, #FF5722, #FFFFFF;
      size: 0.08;
      maxAge: 3;
      velocityValue: 0 0.2 0;
      velocitySpread: 0.3 0.2 0.3;
      accelerationValue: 0 0.02 0;
      opacity: 0.8;
      blending: 1;
      rotationAxis: y;
      enabled: true;
    "></a-entity>

    <!-- Cámara -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
